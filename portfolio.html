</style>

/* ============================================================
   ROUTER & PAGE ORDER
   ============================================================ */
const RouterContext = createContext(null);
const useRouter = () => useContext(RouterContext);

const PAGE_ORDER = [
  { path: '/', label: 'Home' },
  { path: '/about', label: 'About' },
  { path: '/education', label: 'Education' },
  { path: '/skills', label: 'Skills' },
  { path: '/experience', label: 'Experience' },
  { path: '/projects', label: 'Projects' },
  { path: '/achievements', label: 'Achievements' },
  { path: '/activities', label: 'Activities' },
  { path: '/contact', label: 'Contact' }
];

function RouterProvider({ children }) {
  const [path, setPath] = useState(() => {
    const h = window.location.hash.slice(1);
    // Validate hash on initial load. If invalid, fallback to home.
    const isValid = PAGE_ORDER.some(p => p.path === h);
    return isValid ? h : '/';
  });

  useEffect(() => {
    const handler = () => {
      const h = window.location.hash.slice(1) || '/';
      const isValid = PAGE_ORDER.some(p => p.path === h);
      setPath(isValid ? h : '/');
      // Scroll to top smoothly on route change
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    window.addEventListener('hashchange', handler);
    // Initialize hash if empty
    if (!window.location.hash) {
      window.location.hash = '#/';
    } else {
      // Trigger validation if hash exists on load
      const h = window.location.hash.slice(1);
      if (!PAGE_ORDER.some(p => p.path === h)) {
        window.location.hash = '#/';
      }
    }
    return () => window.removeEventListener('hashchange', handler);
  }, []);

  const navigate = useCallback((to) => {
    if (to.startsWith('#')) to = to.slice(1);
    window.location.hash = '#' + to;
  }, []);

  return (
    <RouterContext.Provider value={{ path, navigate }}>
      {children}
    </RouterContext.Provider>
  );
}

function Link({ to, children, className = '', onClick, ...rest }) {
  const { navigate } = useRouter();
  return (
    <a
      href={'#' + to}
      className={className}
      onClick={(e) => {
        // Allow normal anchor behavior for hash, but ensure state updates if needed
        if (onClick) onClick(e);
      }}
      {...rest}
    >
      {children}
    </a>
  );
}

/* ============================================================
   ICONS (FontAwesome Wrapper)

function Icon({ name, size = 16, className = '' }) {
  return (
    <i 
      className={`fa-solid fa-${name} ${className}`} 
      style={{ fontSize: size, display: 'inline-block', width: size, height: size, lineHeight: `${size}px`, textAlign: 'center' }}
      aria-hidden="true"
    ></i>
  );
}

/* ============================================================
   REVEAL ON SCROLL
   ============================================================ */
function Reveal({ children, delay = '', className = '', as = 'div' }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          el.classList.add('in');
          obs.unobserve(el);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return React.createElement(as, { ref, className: `reveal ${delay} ${className}` }, children);
}

    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);

    setDrawerOpen(false);

/* ============================================================
   UI COMPONENTS
   ============================================================ */
function Button({ children, variant = 'primary', size = 'md', as = 'button', className = '', ...props }) {
  const base = 'inline-flex items-center justify-center gap-2 font-semibold rounded-full transition-all duration-300 focus-visible';
  const sizes = {
    sm: 'px-4 py-2 text-xs',
    md: 'px-6 py-3 text-sm',
    lg: 'px-7 py-3.5 text-base'
  };
  const variants = {
    primary: 'btn-primary',
    ghost: 'btn-ghost',
    dark: 'btn-dark'
  };
  return React.createElement(as, {
    className: `${base} ${sizes[size]} ${variants[variant]} ${className}`,
    ...props
  }, children);
}

function SectionHeader({ eyebrow, title, subtitle, dark = false, align = 'left' }) {
  return (
    <Reveal className={align === 'center' ? 'text-center max-w-2xl mx-auto' : 'max-w-2xl'}>
      {eyebrow && (
        <div className={`flex items-center gap-2 mb-4 ${align === 'center' ? 'justify-center' : ''}`}>
          <span className="w-8 h-px bg-terra"></span>
          <span className={`text-xs uppercase tracking-[0.25em] font-semibold ${dark ? 'text-amber' : 'text-terra'}`}>{eyebrow}</span>
        </div>
      )}
      <h2 className={`font-display font-semibold leading-[1.05] tracking-tight ${dark ? 'text-cream' : 'text-espresso'}`} style={{fontSize:'clamp(2rem, 4vw, 3rem)'}}>
        {title}
      </h2>
      {subtitle && (
        <p className={`mt-4 text-base leading-relaxed ${dark ? 'text-cream/70' : 'text-brown/75'}`}>{subtitle}</p>
      )}
    </Reveal>
  );
}

function Tag({ children }) {
  return <span className="tag">{children}</span>;
}

/* ============================================================
   REUSABLE: NEXT PAGE COMPONENT
   ============================================================ */
function NextPage() {
  const { path, navigate } = useRouter();
  const currentIndex = PAGE_ORDER.findIndex(p => p.path === path);
  
  if (currentIndex === -1 || currentIndex === PAGE_ORDER.length - 1) return null;
  
  const nextRoute = PAGE_ORDER[currentIndex + 1];
  
  return (
    <div className="mt-20 pt-10 border-t border-edge/40 flex justify-center">
      <button 
        onClick={() => navigate(nextRoute.path)}
        className="group flex items-center gap-4 text-brown hover:text-terra transition-colors duration-300"
      >
        <div className="text-right">
          <p className="text-xs uppercase tracking-[0.3em] text-brown/50 font-semibold">Next Page</p>
          <p className="font-display text-2xl font-semibold">{nextRoute.label}</p>
        </div>
        <span className="w-12 h-12 rounded-full border border-edge flex items-center justify-center text-terra group-hover:bg-espresso group-hover:text-cream group-hover:border-espresso transition-all duration-300">
          <i className="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
        </span>
      </button>
    </div>
  );
}

/* ============================================================
   REUSABLE: CV VIEWER MODAL
   ============================================================ */
function CVViewer({ open, onClose }) {
  useEffect(() => {
    const onKey = (e) => { 
      if (e.key === 'Escape') onClose(); 
    };
    if (open) {
      document.addEventListener('keydown', onKey);
      document.body.style.overflow = 'hidden';
    }
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = '';
    };
  }, [open, onClose]);

  if (!open) return null;

  return (
    <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 modal-backdrop" onClick={onClose}>
      <div 
        className="modal-enter relative bg-cream-2 max-w-4xl w-full h-[90vh] rounded-2xl border border-edge shadow-2xl flex flex-col overflow-hidden"
        onClick={(e) => e.stopPropagation()}
      >
        {/* Header */}
        <div className="flex items-center justify-between p-4 border-b border-edge bg-cream">
          <h3 className="font-display text-xl font-semibold text-espresso">Vanshika Makkar - CV</h3>
          <div className="flex items-center gap-2">
            <a 
              href="/assets/Vanshika_Makkar_CV.pdf" 
              target="_blank" 
              rel="noreferrer" 
              className="btn-dark px-4 py-2 rounded-full text-xs font-semibold inline-flex items-center gap-2"
            >
              <i className="fa-solid fa-up-right-from-square"></i> New Tab
            </a>
            <a

              download="Vanshika_Makkar_CV.pdf" 
              className="btn-primary px-4 py-2 rounded-full text-xs font-semibold inline-flex items-center gap-2"
            >
              <i className="fa-solid fa-download"></i> Download

            <button

            title="Vanshika Makkar CV"

function SkillBar({ name, level, delay = 0 }) {
  const ref = useRef(null);
  const [w, setW] = useState(0);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          setTimeout(() => setW(level), 100);
          obs.unobserve(el);
        }
      });
    }, { threshold: 0.3 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [level]);
  return (
    <div ref={ref}>
      <div className="flex justify-between items-center mb-2">
        <span className="text-espresso font-medium text-sm">{name}</span>
        <span className="text-brown/60 text-xs font-semibold">{level}%</span>
      </div>
      <div className="skill-track">
        <div className="skill-fill" style={{ width: w + '%' }}></div>
      </div>
    </div>
  );
}

            {DATA.achievements.slice(0, 2).map((a, i) => (
              <Reveal key={i} delay={`reveal-delay-${i+1}`}>
                <div className="card card-hover p-8 h-full bg-gradient-to-br from-cream-2 to-cream relative overflow-hidden">
                  <div className="absolute -top-10 -right-10 w-32 h-32 rounded-full bg-terra/5"></div>
                  <div className="absolute top-6 right-6 font-display text-6xl font-light text-terra/15">
                    {String(i+1).padStart(2,'0')}
                  </div>
                  <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-terra to-amber flex items-center justify-center text-cream mb-5">
                    <Icon name={a.icon} size={26} />
                  </div>
                  <span className="tag mb-3 inline-block">{a.type}</span>
                  <h3 className="font-display text-2xl font-semibold text-espresso mb-3 leading-tight">{a.title}</h3>
                  <p className="text-brown/75 text-sm leading-relaxed">{a.detail}</p>
                </div>
              </Reveal>
            ))}
          </div>

          {/* Rest */}
          <div className="mt-5 grid sm:grid-cols-2 lg:grid-cols-4 gap-5">
            {DATA.achievements.slice(2).map((a, i) => (
              <Reveal key={i} delay={`reveal-delay-${(i%4)+1}`}>
                <div className="card card-hover p-6 h-full">
                  <div className="w-11 h-11 rounded-xl bg-terra/10 flex items-center justify-center text-terra mb-4">
                    <Icon name={a.icon} size={20} />
                  </div>
                  <span className="text-[10px] uppercase tracking-wider text-amber font-semibold">{a.type}</span>
                  <h3 className="font-display text-base font-semibold text-espresso mt-1 mb-2 leading-tight">{a.title}</h3>
                  <p className="text-brown/70 text-xs leading-relaxed">{a.detail}</p>
                </div>
              </Reveal>
            ))}
          </div>

          {/* Certifications */}
          <Reveal className="mt-16">
            <h3 className="font-display text-2xl font-semibold text-espresso mb-6">Certifications</h3>
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
              {DATA.certifications.map((c, i) => (
                <div key={i} className="card p-6">
                  <div className="flex items-center gap-3 mb-3">
                    <div className="w-10 h-10 rounded-lg bg-amber/15 flex items-center justify-center text-amber">
                      <Icon name="certificate" size={20} />
                    </div>
                    <span className="text-xs text-brown/60 font-semibold">{c.duration}</span>
                  </div>
                  <h4 className="font-display text-base font-semibold text-espresso mb-1">{c.title}</h4>
                  <p className="text-brown/70 text-sm">{c.org}</p>
                </div>
              ))}
            </div>
          </Reveal>
        </div>
      </section>
    </div>
  );
}

/* ============================================================
   PAGE: LEADERSHIP & ACTIVITIES
   ============================================================ */
function Activities() {
  const a = DATA.activities;
  return (
    <div className="pt-28">
      <section className="bg-cream py-16 sm:py-24 min-h-screen">
        <div className="max-w-7xl mx-auto px-6 sm:px-10">
          <SectionHeader
            eyebrow="Leadership & Activities"
            title={<>Experiences that <span className="italic text-terra">shaped</span> me.</>}
            subtitle="Beyond academics and internships — the events, roles, and collaborations that built my leadership muscle."
          />

          {/* Hero quote card */}
          <Reveal className="mt-14">
            <div className="section-bg-img rounded-3xl p-8 sm:p-14 text-cream relative overflow-hidden">
              <div className="absolute inset-0 bg-espresso/40"></div>
              <div className="relative max-w-3xl">
                <div className="flex items-center gap-3 mb-6">
                  <div className="w-12 h-12 rounded-xl bg-cream/15 backdrop-blur border border-cream/25 flex items-center justify-center">
                    <Icon name="bullhorn" size={22} />
                  </div>
                  <div>
                    <p className="font-display text-2xl font-semibold">{a.role}</p>
                    <p className="text-amber text-sm">{a.org} · {a.duration}</p>
                  </div>
                </div>
                <p className="text-cream/90 leading-relaxed text-lg">{a.intro}</p>
              </div>
            </div>
          </Reveal>

          {/* Events */}
          <div className="mt-12 grid md:grid-cols-2 gap-6">
            {a.events.map((e, i) => (
              <Reveal key={i} delay={`reveal-delay-${i+1}`}>
                <div className="card card-hover p-7 h-full relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-1 h-full bg-gradient-to-b from-terra to-amber"></div>
                  <div className="absolute -top-6 -right-6 w-24 h-24 rounded-full bg-terra/5"></div>

                  <div className="flex items-center justify-between mb-4">
                    <span className="tag">{e.type}</span>
                    <span className="text-brown/40 text-xs font-mono">{e.duration}</span>
                  </div>

                  <h3 className="font-display text-2xl font-semibold text-espresso mb-2">{e.name}</h3>
                  <p className="text-terra text-sm font-medium mb-5">{e.location}</p>

                  <h4 className="text-xs uppercase tracking-[0.2em] font-semibold text-brown/60 mb-3">Key Contributions</h4>
                  <ul className="space-y-2.5">
                    {e.contributions.map((c, j) => (
                      <li key={j} className="flex gap-3 text-brown/80 text-sm leading-relaxed">
                        <Icon name="check" size={15} className="text-terra mt-1 flex-shrink-0" />
                        <span>{c}</span>
                      </li>
                    ))}
                  </ul>
                </div>
              </Reveal>
            ))}
          </div>

          {/* Skills gained */}
          <Reveal className="mt-12">
            <div className="card p-8 sm:p-10">
              <div className="flex items-center gap-3 mb-6">
                <div className="w-10 h-10 rounded-lg bg-terra/10 flex items-center justify-center text-terra">
                  <Icon name="wand-magic-sparkles" size={18} />
                </div>
                <h3 className="font-display text-xl font-semibold text-espresso">Skills Strengthened Through Activities</h3>
              </div>
              <div className="flex flex-wrap gap-2.5">
                {a.skillsGained.map(s => (
                  <span key={s} className="px-4 py-2 rounded-full bg-gradient-to-br from-terra/10 to-amber/10 border border-terra/20 text-espresso text-sm font-medium">
                    {s}
                  </span>
                ))}
              </div>
            </div>
          </Reveal>
        </div>
      </section>
    </div>
  );
}

/* ============================================================
   PAGE: CONTACT
   ============================================================ */
function Contact() {
  const [form, setForm] = useState({ name:'', email:'', subject:'', message:'' });
  const [sent, setSent] = useState(false);
  const [errors, setErrors] = useState({});

  const validate = () => {
    const e = {};
    if (!form.name.trim()) e.name = 'Please enter your name';
    if (!form.email.trim()) e.email = 'Please enter your email';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) e.email = 'Please enter a valid email';
    if (!form.subject.trim()) e.subject = 'Please add a subject';
    if (!form.message.trim()) e.message = 'Please write a message';
    return e;
  };

  const onSubmit = (e) => {
    e.preventDefault();
    const errs = validate();
    setErrors(errs);
    if (Object.keys(errs).length === 0) {
      const subject = encodeURIComponent(form.subject);
      const body = encodeURIComponent(`Name: ${form.name}\nEmail: ${form.email}\n\n${form.message}`);
      window.location.href = `mailto:${DATA.contact.email}?subject=${subject}&body=${body}`;
      setSent(true);
      setTimeout(() => setSent(false), 6000);
      setForm({ name:'', email:'', subject:'', message:'' });
    }
  };

  const update = (k) => (e) => {
    setForm(f => ({ ...f, [k]: e.target.value }));
    if (errors[k]) setErrors(er => ({ ...er, [k]: undefined }));
  };

  return (
    <div className="pt-28">
      <section className="bg-cream py-16 sm:py-24 min-h-screen">
        <div className="max-w-7xl mx-auto px-6 sm:px-10">
          <SectionHeader
            eyebrow="Contact"
            title={<>Let’s build something <span className="italic text-terra">together</span>.</>}
            subtitle="Have an opportunity, a question, or just want to say hello? I’d love to hear from you."
          />

          <div className="mt-14 grid lg:grid-cols-12 gap-8">
            {/* Contact info */}
            <Reveal className="lg:col-span-5">
              <div className="space-y-4">
                {[
                  { i:'envelope', l:'Email', v: DATA.contact.email, href:`mailto:${DATA.contact.email}` },
                  { i:'linkedin-in', l:'LinkedIn', v:'linkedin.com/in/vanshikamakkar', href: DATA.contact.linkedin },
                  { i:'phone', l:'Phone', v: DATA.contact.phone, href:`tel:${DATA.contact.phone}` },
                  { i:'location-dot', l:'Location', v: DATA.contact.location, href: null }
                ].map((c, i) => (
                  <a
                    key={i}
                    href={c.href || undefined}
                    target={c.href && c.href.startsWith('http') ? '_blank' : undefined}
                    rel="noreferrer"
                    className={`card p-5 flex items-center gap-4 ${c.href ? 'card-hover cursor-pointer' : 'cursor-default'}`}
                  >
                    <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-terra to-amber flex items-center justify-center text-cream flex-shrink-0">
                      <Icon name={c.i} size={20} />
                    </div>
                    <div className="min-w-0">
                      <p className="text-brown/60 text-xs uppercase tracking-wider font-semibold">{c.l}</p>
                      <p className="text-espresso font-medium text-sm break-all">{c.v}</p>
                    </div>
                    {c.href && <Icon name="arrow-up-right-from-square" size={16} className="text-brown/40 ml-auto flex-shrink-0" />}
                  </a>
                ))}
              </div>

              <div className="mt-6 card p-6 bg-gradient-to-br from-espresso to-brown text-cream">
                <p className="font-display text-xl font-semibold mb-2">Currently open to</p>
                <ul className="space-y-2 text-cream/80 text-sm">
                  <li className="flex items-center gap-2"><Icon name="check" size={15} className="text-amber" /> Product Management roles</li>
                  <li className="flex items-center gap-2"><Icon name="check" size={15} className="text-amber" /> HR / People Operations roles</li>
                  <li className="flex items-center gap-2"><Icon name="check" size={15} className="text-amber" /> Data Analytics internships</li>
                  <li className="flex items-center gap-2"><Icon name="check" size={15} className="text-amber" /> Collaboration on projects</li>
                </ul>
              </div>
            </Reveal>

            {/* Form */}
            <Reveal delay="reveal-delay-1" className="lg:col-span-7">
              <form onSubmit={onSubmit} className="card p-8 sm:p-10" noValidate>
                <h3 className="font-display text-2xl font-semibold text-espresso mb-1">Send a Message</h3>
                <p className="text-brown/65 text-sm mb-7">Fill in the form and your email client will open with everything pre-filled — or use the contact details on the left.</p>

                <div className="grid sm:grid-cols-2 gap-5">
                  <Field label="Your Name" error={errors.name}>
                    <input
                      type="text"
                      value={form.name}
                      onChange={update('name')}
                      placeholder="e.g. Priya Sharma"
                      className="w-full px-4 py-3 rounded-xl border border-edge bg-cream/40 text-espresso placeholder-brown/40 focus:outline-none focus:border-terra focus:ring-2 focus:ring-terra/15 transition-all"
                    />
                  </Field>
                  <Field label="Email Address" error={errors.email}>
                    <input
                      type="email"
                      value={form.email}
                      onChange={update('email')}
                      placeholder="you@example.com"
                      className="w-full px-4 py-3 rounded-xl border border-edge bg-cream/40 text-espresso placeholder-brown/40 focus:outline-none focus:border-terra focus:ring-2 focus:ring-terra/15 transition-all"
                    />
                  </Field>
                </div>

                <div className="mt-5">
                  <Field label="Subject" error={errors.subject}>
                    <input
                      type="text"
                      value={form.subject}
                      onChange={update('subject')}
                      placeholder="What's this about?"
                      className="w-full px-4 py-3 rounded-xl border border-edge bg-cream/40 text-espresso placeholder-brown/40 focus:outline-none focus:border-terra focus:ring-2 focus:ring-terra/15 transition-all"
                    />
                  </Field>
                </div>

                <div className="mt-5">
                  <Field label="Message" error={errors.message}>
                    <textarea
                      rows={5}
                      value={form.message}
                      onChange={update('message')}
                      placeholder="Tell me a bit about your opportunity, idea, or question…"
                      className="w-full px-4 py-3 rounded-xl border border-edge bg-cream/40 text-espresso placeholder-brown/40 focus:outline-none focus:border-terra focus:ring-2 focus:ring-terra/15 transition-all resize-none"
                    />
                  </Field>
                </div>

                <div className="mt-7 flex flex-wrap items-center gap-4">
                  <Button type="submit" variant="primary" size="lg">
                    <Icon name="paper-plane" size={16} /> Send Message
                  </Button>
                  {sent && (
                    <span className="text-terra text-sm font-medium flex items-center gap-2">
                      <Icon name="circle-check" size={16} /> Opening your email client…
                    </span>
                  )}
                </div>
              </form>
            </Reveal>
          </div>
        </div>
      </section>
    </div>
  );
}

function Field({ label, error, children }) {
  return (
    <label className="block">
      <span className="block text-xs uppercase tracking-[0.15em] font-semibold text-brown/70 mb-2">{label}</span>
      {children}
      {error && <span className="block mt-1.5 text-xs text-terra font-medium">{error}</span>}
    </label>
  );
}

/* ============================================================
   APP & ROUTING LOGIC
   ============================================================ */
function App() {
  const { path } = useRouter();
  const [cvOpen, setCvOpen] = useState(false);

  let page;
  switch (path) {
    case '/':           page = <Home openCV={() => setCvOpen(true)} />; break;
    case '/about':      page = <About />; break;
    case '/education':  page = <Education />; break;
    case '/skills':     page = <Skills />; break;
    case '/experience': page = <Experience />; break;
    case '/projects':   page = <Projects />; break;
    case '/achievements': page = <Achievements />; break;
    case '/activities': page = <Activities />; break;
    case '/contact':    page = <Contact />; break;
    default:            page = <Home openCV={() => setCvOpen(true)} />;
  }

  // Check if it's the home page or contact page to hide NextPage button
  const showNext = path !== '/' && path !== '/contact';

  return (
    <div className="min-h-screen flex flex-col">
      <Navbar />
      <main key={path} className="flex-1 page-enter">
        {page}
        {showNext && <NextPage />}
      </main>
      <Footer />
      <CVViewer open={cvOpen} onClose={() => setCvOpen(false)} />
    </div>
  );
}

function Root() {
  return (
    <RouterProvider>
      <App />
    </RouterProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root />);

</script>
</body>
</html>
